name: secret-scan

# Public secret-scan gate. Policy and binary live in felhen-ai/ci-security-public;
# this file pins the public action by immutable SHA. No path filter: rulesets
# require the check on every pull request.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: felhen-ai/ci-security-public@89c49d66f0e9de672adb08e85e3607903f3b699a
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
